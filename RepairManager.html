<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        padding: 20px;
        color: #333;
        background-color: #f9fafb;
      }
      h2 {
        margin-top: 0;
        font-size: 18px;
        color: #111827;
        border-bottom: 2px solid #e5e7eb;
        padding-bottom: 10px;
      }
      .description {
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 20px;
      }
      .sheet-list {
        max-height: 300px;
        overflow-y: auto;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 20px;
      }
      .sheet-item {
        display: flex;
        align-items: center;
        padding: 8px;
        border-radius: 4px;
        transition: background 0.2s;
      }
      .sheet-item:hover {
        background-color: #f3f4f6;
      }
      .sheet-item input {
        margin-right: 12px;
        width: 16px;
        height: 16px;
        cursor: pointer;
      }
      .sheet-item label {
        font-size: 14px;
        cursor: pointer;
        flex-grow: 1;
      }
      .controls {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .option-row {
        display: flex;
        align-items: center;
        font-size: 13px;
        color: #374151;
      }
      .option-row input {
        margin-right: 8px;
      }
      .btn-container {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 10px;
      }
      button {
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-cancel {
        background: white;
        border: 1px solid #d1d5db;
        color: #374151;
      }
      .btn-cancel:hover {
        background: #f9fafb;
      }
      .btn-run {
        background: #2563eb;
        border: 1px solid #2563eb;
        color: white;
      }
      .btn-run:hover {
        background: #1d4ed8;
      }
      .btn-run:disabled {
        background: #93c5fd;
        border-color: #93c5fd;
        cursor: not-allowed;
      }
      #status {
        font-size: 12px;
        margin-top: 10px;
        color: #2563eb;
        font-weight: 600;
        display: none;
      }
    </style>
  </head>
  <body>
    <h2>🛠️ Repair Manager</h2>
    <p class="description">Select the sheets you want to repair. The system will force "Update" mode and process them in the correct dependency order.</p>
    
    <div class="sheet-list" id="sheetList">
      <!-- Loaded dynamically -->
      <div style="padding: 20px; text-align: center; color: #999;">Loading sheets...</div>
    </div>

    <div class="controls">
      <div class="option-row">
        <input type="checkbox" id="repairDependents" checked>
        <label for="repairDependents">Automatically repair dependent sheets</label>
      </div>
      
      <div id="status">Processing batch... please wait.</div>

      <div class="btn-container">
        <button class="btn-cancel" onclick="google.script.host.close()">Cancel</button>
        <button class="btn-run" id="runBtn" onclick="runRepair()">Run Repair</button>
      </div>
    </div>

    <script>
      // Load the sheet list on startup
      window.onload = () => {
        google.script.run
          .withSuccessHandler(populateList)
          .withFailureHandler(handleError)
          .getCoreSheetConfigs();
      };

      function populateList(configs) {
        const list = document.getElementById('sheetList');
        list.innerHTML = '';
        
        configs.forEach(config => {
          const div = document.createElement('div');
          div.className = 'sheet-item';
          div.innerHTML = `
            <input type="checkbox" id="chk_${config.longName}" value="${config.longName}">
            <label for="chk_${config.longName}">${config.label}</label>
          `;
          list.appendChild(div);
        });
      }

      function runRepair() {
        const checkboxes = document.querySelectorAll('#sheetList input[type="checkbox"]:checked');
        const selected = Array.from(checkboxes).map(cb => cb.value);
        
        if (selected.length === 0) {
          alert('Please select at least one sheet.');
          return;
        }

        const runBtn = document.getElementById('runBtn');
        const status = document.getElementById('status');
        const repairDependents = document.getElementById('repairDependents').checked;

        runBtn.disabled = true;
        status.style.display = 'block';

        google.script.run
          .withSuccessHandler(() => {
            google.script.host.close();
          })
          .withFailureHandler(err => {
            alert('Repair Failed: ' + err.message);
            runBtn.disabled = false;
            status.style.display = 'none';
          })
          .runRepairBatch(selected, repairDependents);
      }

      function handleError(err) {
        document.getElementById('sheetList').innerHTML = 
          '<div style="color: red; padding: 20px;">Failed to load sheets: ' + err.message + '</div>';
      }
    </script>
  </body>
</html>
